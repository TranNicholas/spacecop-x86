input {
  file {
    path => ["/feeds/zeek/runs/*/ccsds_commands.log", "/feeds/zeek/runs/*/ccsds_telemetry.log"]
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/zeek.sincedb"
    ecs_compatibility => disabled
    codec => json { ecs_compatibility => disabled }
    add_field => { "feed" => "zeek-ccsds" }
  }
  # Connections the flight opens after a command executes (reverse shell, exfiltration).
  file {
    path => ["/feeds/zeek/runs/*/conn.log", "/feeds/zeek/runs/*/weird.log"]
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/zeek-network.sincedb"
    ecs_compatibility => disabled
    codec => json { ecs_compatibility => disabled }
    add_field => { "feed" => "zeek-network" }
  }
  file {
    path => ["/feeds/mission/logs/stix_log.json"]
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/stix.sincedb"
    ecs_compatibility => disabled
    codec => json { ecs_compatibility => disabled }
    add_field => { "feed" => "spacecop-stix" }
  }
}
filter {
  # Every record states which side produced it. Zeek runs in the flight namespace
  # as the evaluation WITNESS; it is not a ground detector. STIX is on-board
  # output read from the flight volume, an inspection channel the real ground lacks.
  if [feed] in ["zeek-ccsds", "zeek-network"] {
    mutate {
      add_field => {
        "trust_domain" => "witness"
        "producer" => "witness-zeek"
      }
    }
    dissect { mapping => { "path" => "/feeds/zeek/runs/%{run_id}/%{log_name}" } }
  } else if [feed] == "spacecop-stix" {
    mutate {
      add_field => {
        "trust_domain" => "onboard"
        "producer" => "spacecop-stix-volume"
      }
    }
  }
  if [feed] in ["zeek-ccsds", "zeek-network"] and [ts] {
    date {
      match => ["ts", "ISO8601", "UNIX"]
      target => "@timestamp"
    }
  }
  if [feed] == "zeek-ccsds" {
    mutate { add_field => { "observation_path" => "ground_link" } }
    if [packet_name] == "SPACECOP_REPORT_TLM" {
      # The original telemetry definition places IDS_MSG after 16 CCSDS bytes.
      # Decode the downlinked bytes already captured by the original analyzer.
      ruby {
        code => '
          hex = event.get("raw_hex")
          if hex.is_a?(String)
            raw = [hex.delete(" ")].pack("H*")
            message = raw.byteslice(16, 1024).to_s
                         .split(0.chr, 2).first
                         .force_encoding("UTF-8").scrub
            event.set("ids_message", message) unless message.empty?
          end
        '
      }
    }
  } else if [feed] == "spacecop-stix" {
    mutate { add_field => { "observation_path" => "onboard_volume" } }
  }
  mutate { add_field => { "lab_instance" => "${LAB_INSTANCE}" } }
}
output {
  elasticsearch {
    hosts => ["http://security-elasticsearch:9200"]
    index => "spacecop-%{[feed]}-%{+YYYY.MM.dd}"
    ilm_enabled => false
  }
}
